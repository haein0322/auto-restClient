openapi: 3.0.3
info:
  title: 샘플 API
  description: |
    AI RestClient 시스템을 체험하기 위한 샘플 명세입니다.
    내장 Mock 서버(`/mock`)가 이 명세와 동일하게 동작합니다.
    모든 API는 `X-API-KEY: demo-key` 헤더가 필요합니다.
  version: 1.0.0
servers:
  - url: http://localhost:8090/mock
    description: 내장 Mock 서버
tags:
  - name: Item
    description: 항목 관리
paths:
  /items:
    get:
      tags: [Item]
      operationId: listItems
      summary: 항목 목록 조회
      description: 등록된 항목을 최근 등록순으로 조회합니다. limit으로 개수를 제한할 수 있습니다.
      parameters:
        - name: limit
          in: query
          description: 최대 조회 개수
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Item]
      operationId: createItem
      summary: 항목 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemRequest' }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        description: 항목 ID
        schema: { type: integer, format: int64 }
    get:
      tags: [Item]
      operationId: getItem
      summary: 항목 단건 조회
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: 데모용 API 키(`demo-key`)
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 인증 실패(API 키 누락 또는 불일치)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ItemRequest:
      type: object
      description: 항목 등록 요청
      required: [name, price]
      properties:
        name: { type: string, maxLength: 100, description: 항목 이름 }
        description: { type: string, maxLength: 500, description: 항목 설명 }
        price: { type: number, minimum: 0, description: 가격 }
    Item:
      type: object
      required: [id, name, price, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 오류 메시지
