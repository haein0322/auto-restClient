spring:
  application:
    name: airestclient
  datasource:
    url: jdbc:h2:file:./data/airestclient;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8090

app:
  cors:
    allowed-origins: http://localhost:3000
  ai:
    # fake: 키 없이 동작하는 규칙 기반 분석 / claude: 실제 Claude API (APP_AI_PROVIDER=claude 로 전환)
    provider: ${APP_AI_PROVIDER:fake}
    max-endpoints: 200
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5-5
      timeout-seconds: 180
      max-tokens: 16000
